<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1b18">
<title>武术理论练习</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23a8342b'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23fff' font-family='serif'%3E武%3C/text%3E%3C/svg%3E">
<style>
/* 武术理论刷题 · 简洁版 */
:root{
  --bg:#f3f4f6;
  --surface:#ffffff;
  --surface-2:#f8f9fa;
  --text:#1b1e23;
  --text2:#6b7280;
  --text3:#9ca3af;
  --border:#e4e6ea;
  --accent:#a8342b;
  --accent-soft:#fbeeec;
  --green:#15803d;
  --green-bg:#f0f9f2;
  --green-line:#cfe8d6;
  --red:#b91c1c;
  --red-bg:#fdf1f0;
  --red-line:#f0cfcb;
  --gold:#9a7a3f;
  --gold-soft:#f7f0e0;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
:root[data-theme="dark"]{
  --bg:#101215;
  --surface:#191c20;
  --surface-2:#23272c;
  --text:#f0f2f4;
  --text2:#b3bac2;
  --text3:#838b94;
  --border:#2f353c;
  --accent:#c25a4e;
  --accent-soft:#3a2321;
  --green:#6cc08d;
  --green-bg:#182a21;
  --green-line:#2e5a44;
  --red:#e26a5f;
  --red-bg:#3a2320;
  --red-line:#6d3b36;
  --gold:#c9a563;
  --gold-soft:#332b1e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.app-shell{
  max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;
  background:var(--bg);position:relative;padding-bottom:64px;
  box-shadow:0 0 50px rgba(30,35,45,.06);
}
.app-shell.no-tab{padding-bottom:0}
::selection{background:#f3e2df}

/* 顶栏 */
.appbar{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:11px 16px;
  display:flex;align-items:center;gap:10px;
}
.seal-sm{
  width:32px;height:32px;border-radius:7px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-family:var(--serif);font-size:18px;flex:none;
}
.appbar .name{flex:1;min-width:0}
.appbar .name b{display:block;font-size:15px;letter-spacing:.02em}
.appbar .name small{display:block;font-size:10.5px;color:var(--text2);margin-top:2px;letter-spacing:.04em}
.text-btn{font-size:12px;color:var(--text2);padding:6px 8px;border-radius:8px}
.text-btn:active{background:var(--surface-2)}

.page{padding:14px 14px 20px}

/* 数据条 */
.statbar{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden;
}
.statbar .st{padding:11px 4px;text-align:center;border-right:1px solid var(--border)}
.statbar .st:last-child{border:0}
.statbar b{display:block;font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums}
.statbar span{display:block;font-size:10.5px;color:var(--text2);margin-top:3px}
.statbar .ok b{color:var(--green)}
.statbar .bad b{color:var(--red)}
.statbar .all b{color:var(--accent)}

.overall{display:flex;align-items:center;gap:10px;margin:12px 2px 4px}
.overall span{font-size:11px;color:var(--text2);flex:none}
.overall .bar{flex:1;height:5px;border-radius:3px;background:#e6e8ec;overflow:hidden}
.overall .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.overall b{font-size:11px;color:var(--text2);font-variant-numeric:tabular-nums;flex:none}
.display-bar{display:flex;align-items:center;gap:8px;margin:10px 2px 0}
.display-bar .lbl{font-size:11px;color:var(--text2)}
.display-bar .seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.display-bar .seg button{padding:5px 10px;font-size:11px;color:var(--text2);border-right:1px solid var(--border)}
.display-bar .seg button:last-child{border-right:0}
.display-bar .seg button.active{background:var(--accent);color:#fff}
.display-bar .theme-btn{margin-left:auto;font-size:11px;color:var(--text2);border:1px solid var(--border);background:var(--surface);padding:5px 9px;border-radius:8px}

/* 分组标题 */
.group-title{
  display:flex;align-items:center;justify-content:space-between;
  margin:20px 4px 8px;
}
.group-title h2{font-size:12.5px;font-weight:600;color:var(--text2);letter-spacing:.08em;margin:0}
.group-title span{font-size:11px;color:var(--text3)}

/* 目录 */
.dir-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.dir-chapter{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:14px;border-bottom:1px solid var(--border);background:var(--surface)}
.dir-chapter .t{flex:1;min-width:0}
.dir-chapter .t b{display:block;font-family:var(--serif);font-size:16.5px;line-height:1.35;letter-spacing:.03em}
.dir-chapter .t small{display:block;font-size:11px;color:var(--text2);margin-top:4px}
.chap-main{flex:1 1 100%;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;background:none;padding:0;font-family:inherit;color:inherit}
.chap-main .t{flex:1;min-width:0}
.toggle-hint{display:inline-flex;align-items:center;gap:4px;flex:none;padding:5px 9px;border-radius:999px;border:1px solid var(--accent);background:var(--surface);color:var(--accent);font-size:11px;font-weight:600;letter-spacing:.04em;box-shadow:0 2px 6px rgba(168,52,43,.10);transition:background .18s,color .18s,border-color .18s}
.dir-card.open .toggle-hint{background:var(--accent);border-color:var(--accent);color:#fff}
.chevron{flex:none;color:currentColor;font-size:11px;line-height:1;transition:transform .2s ease;transform-origin:center}
.dir-card.open .chevron{transform:rotate(180deg)}
.dir-sections{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .22s ease,visibility 0s .22s}
.dir-card.open .dir-sections{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .22s ease,visibility 0s}
.dir-inner{min-height:0;overflow:hidden}
.pill-btn{
  flex:none;background:var(--accent);color:#fff;font-size:12px;padding:8px 12px;
  border-radius:999px;letter-spacing:.04em;
}
.pill-btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--text2)}
.ch-actions{display:flex;gap:6px;flex:none}
.pill-btn:active{opacity:.9}

.dir-row{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid var(--border);background:var(--surface)}
.dir-row:last-child{border:0}
.dir-row:active{background:var(--surface-2)}
.dir-row .num{
  width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);
  display:grid;place-items:center;font-size:11px;color:var(--text2);flex:none;
}
.dir-row .t{flex:1;min-width:0;font-size:14px;line-height:1.35}
.dir-row .t small{display:block;font-size:10.5px;color:var(--text3);margin-top:4px}
.dir-row .c{font-size:12px;color:var(--text2);flex:none;font-variant-numeric:tabular-nums}
.dir-row .arrow{color:#c3c7ce;font-size:16px;flex:none;font-family:var(--serif)}
.dir-row .done-tag{font-size:10px;color:var(--green);background:var(--green-bg);border:1px solid var(--green-line);padding:2px 6px;border-radius:4px;margin-left:6px}

/* 题型 */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;
  display:flex;align-items:center;gap:11px;
}
.type-card:active{background:var(--surface-2)}
.type-card .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--serif);font-size:16px;flex:none}
.type-card .ic.single{background:var(--accent-soft);color:var(--accent)}
.type-card .ic.judge{background:var(--gold-soft);color:var(--gold)}
.type-card b{display:block;font-size:14px;font-weight:600}
.type-card small{display:block;font-size:10.5px;color:var(--text3);margin-top:3px}

/* 模拟考试 */
.exam-band{
  margin-top:16px;background:#23252a;color:#f2f3f5;border-radius:12px;padding:14px 15px;
  display:flex;align-items:center;gap:12px;
}
.exam-band .t{flex:1;min-width:0}
.exam-band b{display:block;font-size:14px;letter-spacing:.04em}
.exam-band small{display:block;font-size:10.5px;color:#a9adb6;margin-top:4px;line-height:1.5}
.exam-band .go{background:var(--accent);color:#fff;font-size:12.5px;padding:8px 15px;border-radius:999px;flex:none}
.exam-band.off{opacity:.82}
.exam-band .go.disabled{background:#3c3f45;color:#a9adb6;box-shadow:none}
.exam-list{display:flex;flex-direction:column;gap:9px}
.exam-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px}
.exam-item:active{background:var(--surface-2)}
.exam-item .ei-main{flex:1;min-width:0}
.exam-item .ei-main b{display:block;font-size:14.5px;letter-spacing:.02em}
.exam-item .ei-main small{display:block;font-size:10.5px;color:var(--text3);margin-top:4px}
.exam-item .ei-best{font-size:10.5px;color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:5px;flex:none}
.exam-item .ei-arrow{color:#c3c7ce;font-family:var(--serif);font-size:18px;flex:none}

.note{padding:18px 6px 4px;font-size:10.5px;line-height:1.8;color:var(--text3);text-align:center}

/* 底部导航 */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;
  display:flex;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text3);font-size:10px;padding:3px;position:relative}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--accent)}
.tab .dot{
  position:absolute;top:0;left:calc(50% + 6px);min-width:14px;height:14px;border-radius:7px;
  background:var(--accent);color:#fff;font-size:9px;display:grid;place-items:center;padding:0 4px;
}

/* 练习页 */
.quiz-screen{height:100vh;height:100dvh;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.quiz-bar{
  position:relative;flex:none;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:10px 10px;display:flex;align-items:center;gap:6px;
}
.icon-btn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--text2)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.quiz-bar .crumb{flex:1;min-width:0;text-align:center}
.quiz-bar .crumb b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quiz-bar .crumb small{display:block;font-size:10.5px;color:var(--text2);margin-top:2px}
.fav-btn{color:#b9bec7}
.fav-btn.on{color:var(--gold)}
.fav-btn.on svg{fill:var(--gold);stroke:var(--gold)}
.timer{font-variant-numeric:tabular-nums;font-size:12px;color:var(--red);background:var(--red-bg);padding:5px 8px;border-radius:6px;flex:none;letter-spacing:.04em}

.quiz-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;padding:10px 14px 12px;width:100%}
.qprog{display:flex;align-items:center;gap:10px;margin:2px 2px 11px}
.qprog .n{font-size:12px;color:var(--text2);flex:none;font-variant-numeric:tabular-nums}
.qprog .n b{color:var(--text);font-size:13.5px}
.qprog .bar{flex:1;height:5px;border-radius:3px;background:#e4e6ea;overflow:hidden}
.qprog .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.qprog .tp{font-size:10.5px;color:var(--text2);background:var(--surface);border:1px solid var(--border);padding:3px 7px;border-radius:5px;flex:none}

.qcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 14px;box-shadow:0 2px 10px rgba(25,30,40,.04);touch-action:pan-y}
.qcard.enter-right,.qcard.enter-left{animation:qFade .14s ease both}
@keyframes qFade{from{opacity:.55}to{opacity:1}}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.badge{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:5px;letter-spacing:.04em}
.badge.single{background:var(--accent-soft);color:var(--accent)}
.badge.judge{background:var(--gold-soft);color:var(--gold)}
.badge.study{background:#f2e9d8;color:#8a6a2f}
.qhead .src{font-size:10.5px;color:var(--text3);margin-left:auto}
.qtext{font-size:16px;line-height:1.66;margin:0;font-weight:600;letter-spacing:.005em}
.qimg{margin:0 0 10px;text-align:center}
.qimg img{max-width:100%;height:auto;border:1px solid var(--border);border-radius:8px;display:inline-block}
.opts{margin-top:12px}
.opt{
  width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;
  padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--surface);
  margin-top:7px;font-size:14px;line-height:1.5;transition:border-color .12s,background .12s;
}
.opt .letter{
  width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--text2);
  display:grid;place-items:center;font-size:11.5px;flex:none;margin-top:1px;
}
.opt .txt{flex:1;padding-top:1px}
.opt:active{background:var(--surface-2)}
.opt.correct{border-color:var(--green-line);background:var(--green-bg)}
.opt.correct .letter{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red-line);background:var(--red-bg)}
.opt.wrong .letter{background:var(--red);color:#fff}
.opt.chosen{border-color:#b9bec7;background:var(--surface-2)}
.opt.dim{opacity:.55}
.opt.blank{opacity:.38;border-style:dashed;background:var(--surface)}
.opt[disabled]{cursor:default}
.mark{margin-left:auto;font-size:11px;font-weight:600;flex:none;padding-top:3px;color:var(--green)}
.opt.wrong .mark{color:var(--red)}

/* 即时反馈 */
.fb{margin-top:12px;border-radius:10px;padding:10px 12px;border:1px solid transparent}
.fb.ok{background:var(--green-bg);border-color:var(--green-line)}
.fb.no{background:var(--red-bg);border-color:var(--red-line)}
.fb-head{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700}
.fb.ok .fb-head{color:var(--green)}
.fb.no .fb-head{color:var(--red)}
.fb.study{background:#fbf7ee;border-color:#eadfc8}
.fb.study .fb-head{color:var(--gold)}
.fb.study .fb-ans b{color:var(--accent)}
.fb-ans{margin-top:8px;font-size:13.5px;line-height:1.6;color:var(--text)}
.fb-ans b{color:var(--green);font-weight:600}
.fb.no .fb-ans b{color:var(--green)}
.fb-exp{margin-top:5px;font-size:12px;line-height:1.62;color:#4b5563}
.fb-exp em{font-style:normal;color:var(--text3)}

.quiz-foot{
  position:relative;flex:none;margin-top:0;width:100%;
  display:flex;gap:9px;padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--border);z-index:30;
}
.btn{flex:1;height:45px;border-radius:9px;font-size:14.5px;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:5px}
.btn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--text2);flex:0 0 33%}
.quiz-foot .btn.ghost{flex:0 0 27%}
.quiz-foot .btn.dark{flex:0 0 31%;font-size:13.5px;padding:0 6px}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.dark{background:#23252a;color:#fff}
.btn[disabled]{background:#d8dbe0;color:#fff}
.btn:active{opacity:.94}

/* 答题卡 */
.modal-mask{position:fixed;inset:0;background:rgba(20,22,26,.42);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.modal-mask.center{align-items:center;padding:22px}
.dialog{width:100%;max-width:330px;background:var(--surface);border-radius:18px;padding:22px 18px 16px;box-shadow:0 18px 50px rgba(15,18,25,.22);animation:pop .18s cubic-bezier(.22,.61,.36,1) both}
@keyframes pop{from{transform:scale(.96) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.confirm-icon{width:48px;height:48px;border-radius:50%;background:var(--red-bg);color:var(--red);display:grid;place-items:center;margin:0 auto 12px}
.confirm-icon svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dialog h3{font-size:17px;margin:0 0 7px;text-align:center;letter-spacing:.02em}
.dialog .desc{font-size:12.5px;line-height:1.8;color:var(--text2);text-align:center;margin:0 auto;max-width:17em}
.confirm-actions{display:flex;gap:9px;margin-top:18px}
.confirm-actions .btn{flex:1;height:44px;font-size:14px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:640px;background:var(--surface);border-radius:16px 16px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease;max-height:78vh;overflow:auto;
}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head b{font-size:15px}
.sheet-head .close{font-size:12px;color:var(--text2)}
.sheet-legend{display:flex;gap:14px;font-size:10.5px;color:var(--text2);margin-bottom:10px}
.sheet-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.grid button{aspect-ratio:1;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--text2)}
.grid button.done{background:#23252a;border-color:#23252a;color:#fff}
.grid button.ok{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}
.grid button.bad{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:2px}
.sheet-submit{margin-top:16px}

/* 结果页 */
.result-wrap{padding:26px 16px 30px}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 16px;text-align:center}
.score-ring{
  --p:0;width:128px;height:128px;border-radius:50%;margin:2px auto 14px;position:relative;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),#eceef1 0);display:grid;place-items:center;
}
.score-ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}
.score-ring .inner{position:relative;text-align:center}
.score-ring .num{font-size:38px;line-height:1;font-weight:700}
.score-ring .num small{font-size:13px;color:var(--text2);font-weight:400}
.score-ring .lbl{font-size:10.5px;color:var(--text2);margin-top:5px;letter-spacing:.1em}
.result-card h2{font-size:19px;margin:0 0 5px;letter-spacing:.04em}
.result-card .sub{font-size:12px;color:var(--text2);margin:0 0 16px}
.result-stats{display:flex;border-top:1px solid var(--border);padding-top:14px}

<script>
/* 武术理论刷题 · 交互（简洁版） */
(function () {
  "use strict";

  var DATA = window.QUIZ_DATA;
  var SECTIONS = DATA.sections;
  var ALL = [];
  SECTIONS.forEach(function (sec) {
    sec.questions.forEach(function (q) {
      ALL.push(Object.assign({}, q, { sectionId: sec.id, sectionTitle: sec.title, chapter: sec.chapter }));
    });
  });
  var BY_ID = {};
  ALL.forEach(function (q) { BY_ID[q.id] = q; });

  var CHAPTERS = [];
  SECTIONS.forEach(function (sec) {
    var ch = CHAPTERS.filter(function (c) { return c.title === sec.chapter; })[0];
    if (!ch) { ch = { title: sec.chapter, sections: [] }; CHAPTERS.push(ch); }
    ch.sections.push(sec);
  });

  var KEY = "wushu-quiz-sample-v2";
  var state = load();
  var session = null;
  var lastResult = null;
  var examTimer = null;
  var modalOpen = false;
  var animating = false;
  var suppressClick = false;

  function load() {
    try {
      var raw = JSON.parse(localStorage.getItem(KEY));
      if (raw && raw.records) {
        raw.favs = raw.favs || [];
        raw.wrong = raw.wrong || {};
        raw.examBest = raw.examBest || {};
        raw.expanded = raw.expanded || {};
        raw.font = raw.font || "m";
        raw.theme = raw.theme || "light";
        return raw;
      }
    } catch (e) {}
    return { records: {}, favs: [], wrong: {}, examBest: {}, expanded: {}, font: "m", theme: "light" };
  }
  function applyPrefs() {
    document.documentElement.setAttribute("data-font", state.font || "m");
    document.documentElement.setAttribute("data-theme", state.theme || "light");
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  var ICONS = {
    home: '<svg viewBox="0 0 24 24"><path d="M3.5 10.4 12 3.4l8.5 7"/><path d="M5.5 9.5V20.5h13V9.5"/><path d="M9.8 20.5v-5.6h4.4v5.6"/></svg>',
    wrong: '<svg viewBox="0 0 24 24"><path d="M5 4.5h11.5a2.5 2.5 0 0 1 2.5 2.5v12.5H7.5A2.5 2.5 0 0 1 5 17z"/><path d="M5 17a2.5 2.5 0 0 1 2.5-2.5H19"/><path d="m9.5 8.6 4.4 4.4m0-4.4-4.4 4.4"/></svg>',
    star: '<svg viewBox="0 0 24 24"><path d="m12 3.6 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z"/></svg>',
    back: '<svg viewBox="0 0 24 24"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg>',
    grid: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.4" height="6.4" rx="1.4"/><rect x="13.6" y="4" width="6.4" height="6.4" rx="1.4"/><rect x="4" y="13.6" width="6.4" height="6.4" rx="1.4"/><rect x="13.6" y="13.6" width="6.4" height="6.4" rx="1.4"/></svg>',
    starFill: '<svg viewBox="0 0 24 24"><path d="m12 3.6 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.8l5.9-.9z"/></svg>'
  };

  function stats() {
    var ids = Object.keys(state.records), correct = 0;
    ids.forEach(function (id) { if (state.records[id].c) correct++; });
    return {
      done: ids.length,
      correct: correct,
      rate: ids.length ? Math.round((correct / ids.length) * 100) : 0,
      wrong: Object.keys(state.wrong).length,
      fav: state.favs.length,
      total: ALL.length
    };
  }
  function secDone(sec) {
    var n = 0, ok = 0;
    sec.questions.forEach(function (q) {
      var r = state.records[q.id];
      if (r) { n++; if (r.c) ok++; }
    });
    return { n: n, ok: ok, total: sec.questions.length };
  }

  function tabbar(active) {
    var st = stats();
    function item(id, href, icon, label) {
      var dot = id === "wrong" && st.wrong ? '<span class="dot">' + (st.wrong > 99 ? "99" : st.wrong) + "</span>" : "";
      return '<a class="tab ' + (active === id ? "active" : "") + '" href="' + href + '">' + icon + "<span>" + label + "</span>" + dot + "</a>";
    }
    return '<nav class="tabbar">' +
      item("home", "#/home", ICONS.home, "练习") +
      item("wrong", "#/wrong", ICONS.wrong, "错题") +
      item("fav", "#/fav", ICONS.star, "收藏") +
      "</nav>";
  }

  /* ---------------- 首页 ---------------- */
  function renderHome() {
    var st = stats();
    var totalAll = ALL.length;

    var cards = "";
    CHAPTERS.forEach(function (ch, ci) {
      var cTotal = 0, cDone = 0, rows = "";
      var isOpen = !!(state.expanded && state.expanded[ch.title]);
      ch.sections.forEach(function (sec, i) {
        var d = secDone(sec);
        cTotal += d.total;
        cDone += d.n;
        rows += '<a class="dir-row" href="#/practice/' + sec.id + '">' +
          '<span class="num">' + (i + 1) + "</span>" +
          '<span class="t">' + esc(sec.title) +
            "<small>" + sec.questions.length + " 题 · " + esc(sec.pages) + " · 已练 " + d.n + "</small></span>" +
          (d.n === d.total ? '<span class="done-tag">已完成</span>' : "") +
          '<span class="c">' + d.n + "/" + d.total + "</span>" +
          '<span class="arrow">›</span>' +
        "</a>";
      });
      cards += '<div class="dir-card' + (isOpen ? " open" : "") + '" style="margin-bottom:12px">' +
        '<div class="dir-chapter">' +
          '<button class="chap-main" data-chapter-toggle="' + ci + '" aria-expanded="' + (isOpen ? "true" : "false") + '">' +
            '<span class="t"><b>' + esc(ch.title) + "</b><small>" + ch.sections.length + " 节 · " + cTotal + " 题 · 完成 " + cDone + " 题</small></span>" +
            '<span class="toggle-hint"><span class="toggle-text">' + (isOpen ? "收起" : "展开") + '</span><span class="chevron">⌄</span></span>' +
          "</button>" +
          '<div class="ch-actions">' +
            '<button class="pill-btn" data-chapter="' + ci + '">整章练习</button>' +
            '<button class="pill-btn ghost" data-study="' + ci + '">整章背题</button>' +
          "</div>" +
        "</div>" +
        '<div class="dir-sections"><div class="dir-inner">' + rows + "</div></div>" +
      "</div>";
    });

    var singleTotal = ALL.filter(function (q) { return q.type === "single"; }).length;
    var judgeTotal = ALL.filter(function (q) { return q.type === "judge"; }).length;
    var singleDone = ALL.filter(function (q) { return q.type === "single" && state.records[q.id]; }).length;
    var judgeDone = ALL.filter(function (q) { return q.type === "judge" && state.records[q.id]; }).length;
    var exams = window.QUIZ_EXAMS || [];

    document.getElementById("app").className = "app-shell";
    document.getElementById("app").innerHTML =
      '<header class="appbar">' +
        '<div class="seal-sm">武</div>' +
        '<div class="name"><b>武术理论刷题</b><small>社会体育指导员（武术）</small></div>' +
        '<button class="text-btn" data-act="reset">重置</button>' +
      "</header>" +

      '<main class="page">' +
        '<div class="statbar">' +
          '<div class="st"><b>' + st.done + '</b><span>已练</span></div>' +
          '<div class="st ok"><b>' + st.rate + '%</b><span>正确率</span></div>' +
          '<div class="st bad"><a href="#/wrong" style="color:inherit;display:block"><b>' + st.wrong + '</b><span>错题</span></a></div>' +
          '<div class="st all"><b>' + totalAll + '</b><span>总题量</span></div>' +
        "</div>" +
        '<div class="overall"><span>总进度</span><span class="bar"><i style="width:' + pct(st.done, totalAll) + '%"></i></span><b>' + st.done + "/" + totalAll + "</b></div>" +
        '<div class="display-bar">' +
          '<span class="lbl">显示</span>' +
          '<div class="seg">' +
            '<button data-font-choice="s" class="' + (state.font === "s" ? "active" : "") + '">小</button>' +
            '<button data-font-choice="m" class="' + (state.font === "m" ? "active" : "") + '">中</button>' +
            '<button data-font-choice="l" class="' + (state.font === "l" ? "active" : "") + '">大</button>' +
          "</div>" +
          '<button class="theme-btn" data-theme-toggle>' + (state.theme === "dark" ? "日间模式" : "夜间模式") + "</button>" +
        "</div>" +

        '<div class="group-title"><h2>章节练习</h2><span>按教材目录</span></div>' +
        cards +

        '<div class="group-title"><h2>按题型练习</h2><span>两种题型</span></div>' +
        '<div class="type-grid">' +
          '<a class="type-card" href="#/type/single"><span class="ic single">单</span><span><b>单项选择</b><small>' + singleTotal + " 题 · 已练 " + singleDone + "</small></span></a>" +
          '<a class="type-card" href="#/type/judge"><span class="ic judge">判</span><span><b>判断题</b><small>' + judgeTotal + " 题 · 已练 " + judgeDone + "</small></span></a>" +
        "</div>" +

        '<div class="exam-band' + (exams.length ? "" : " off") + '">' +
          '<div class="t"><b>综合模拟考试</b><small>' +
            (exams.length
              ? exams.length + " 套 · 每套 100 题 · 90 分钟 · 70 单选 + 30 判断"
              : "全书完成后开放 · 100 题 · 70 单选 + 30 判断") +
          "</small></div>" +
          '<button class="go' + (exams.length ? "" : " disabled") + '" data-act="exam">' +
            (exams.length ? "选择试卷" : "未开放") + "</button>" +
        "</div>" +

        '<p class="note">题目依据体育学院通用教材《武术》全书七章。<br>' +
          (exams.length ? "综合模拟共 " + exams.length + " 套，交卷后统一判分。" : "综合模拟将在全书章节完成后开放。") +
        "</p>" +
      "</main>" +
      tabbar("home");

    document.querySelectorAll("#app [data-act]").forEach(function (el) {
      el.addEventListener("click", function () {
        var act = el.getAttribute("data-act");
        if (act === "exam") {
          if (exams.length) openExamSheet();
          else toast("综合模拟将在全书章节完成后开放");
        }
        if (act === "reset") confirmReset();
      });
    });
    document.querySelectorAll("#app [data-font-choice]").forEach(function (el) {
      el.addEventListener("click", function () {
        state.font = el.getAttribute("data-font-choice");
        save(); applyPrefs(); renderHome();
      });
    });
    var themeBtn = document.querySelector("#app [data-theme-toggle]");
    if (themeBtn) themeBtn.addEventListener("click", function () {
      state.theme = state.theme === "dark" ? "light" : "dark";
      save(); applyPrefs(); renderHome();
    });
    document.querySelectorAll("#app [data-chapter-toggle]").forEach(function (el) {
      el.addEventListener("click", function () {
        var ci = parseInt(el.getAttribute("data-chapter-toggle"), 10);
        var ch = CHAPTERS[ci];
        if (!ch) return;
        var card = el.closest(".dir-card");
        var open = !card.classList.contains("open");
        card.classList.toggle("open", open);
        el.setAttribute("aria-expanded", open ? "true" : "false");
        var hint = el.querySelector(".toggle-text");
        if (hint) hint.textContent = open ? "收起" : "展开";
        state.expanded = state.expanded || {};
        state.expanded[ch.title] = open;
        save();
      });
    });
    document.querySelectorAll("#app [data-chapter]").forEach(function (el) {
      el.addEventListener("click", function () {
        var ch = CHAPTERS[parseInt(el.getAttribute("data-chapter"), 10)];
        if (!ch) return;
        var ids = [];
        ch.sections.forEach(function (sec) {
          sec.questions.forEach(function (q) { ids.push(q.id); });
        });
        startSession(ids, ch.title + " · 整章练习", "practice");
      });
    });
    document.querySelectorAll("#app [data-study]").forEach(function (el) {
      el.addEventListener("click", function () {
        var ch = CHAPTERS[parseInt(el.getAttribute("data-study"), 10)];
        if (!ch) return;
        var ids = [];
        ch.sections.forEach(function (sec) {
          sec.questions.forEach(function (q) { ids.push(q.id); });
        });
        startSession(ids, ch.title + " · 整章背题", "study");
      });
    });
    window.scrollTo(0, 0);
  }

  /* ---------------- 练习 / 考试 ---------------- */
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function startSession(ids, title, mode, startAt, ctx) {
    if (!ids.length) { toast("暂无题目"); return; }
    var back = location.hash || "#/home";
    if (/^#\/(practice|quiz|result|type)/.test(back)) back = "#/home";
    session = {
      ids: ids.slice(),
      idx: startAt || 0,
      title: title,
      mode: mode || "practice",
      answers: {},
      back: back,
      sectionId: (ctx && ctx.sectionId) || null,
      examId: (ctx && ctx.examId) || null,
      left: mode === "exam" ? 90 * 60 : 0
    };
    location.hash = "#/quiz";
  }
  function openExamSheet() {
    var exams = window.QUIZ_EXAMS || [];
    var rows = exams.map(function (p) {
      var best = state.examBest && state.examBest[p.id];
      return '<button class="exam-item" data-exam="' + p.id + '">' +
        '<span class="ei-main"><b>' + esc(p.title) + "</b>" +
          "<small>100 题 · 90 分钟 · 70 单选 + 30 判断</small></span>" +
        '<span class="ei-best">' + (best != null ? "最高 " + best + " 分" : "未作答") + "</span>" +
        '<span class="ei-arrow">›</span></button>';
    }).join("");
    openModal(
      '<div class="sheet-head"><b>选择综合试卷</b><button class="close" data-close>收起</button></div>' +
      '<div class="exam-list">' + rows + "</div>"
    );
    document.querySelectorAll("[data-exam]").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-exam");
        closeModal();
        startExamPaper(id);
      });
    });
  }

  function startExamPaper(id) {
    var paper = (window.QUIZ_EXAMS || []).filter(function (p) { return p.id === id; })[0];
    if (!paper) return;
    startSession(paper.questions, paper.title, "exam", 0, { examId: paper.id });
    startExamTimer();
  }
  function startExamTimer() {
    clearInterval(examTimer);
    if (!session || session.mode !== "exam") return;
    examTimer = setInterval(function () {
      if (!session || session.mode !== "exam") { clearInterval(examTimer); return; }
      session.left--;
      var el = document.getElementById("exam-timer");
      if (el) el.textContent = fmtTime(session.left);
      if (session.left <= 0) {
        clearInterval(examTimer);
        toast("时间到，自动交卷");
        submitExam();
      }
    }, 1000);
  }
  function fmtTime(s) {
    if (s < 0) s = 0;
    return pad2(Math.floor(s / 60)) + ":" + pad2(s % 60);
  }

  function currentQ() { return BY_ID[session.ids[session.idx]]; }
  function answeredCount() {
    return session.ids.filter(function (id) { return session.answers[id] !== undefined; }).length;
  }

  function renderQuiz(keepScroll, dir) {
    if (!session) { location.hash = "#/home"; return; }
    var q = currentQ();
    if (!q) { finishSession(); return; }

    var isExam = session.mode === "exam";
    var isStudy = session.mode === "study";
    var enterCls = dir === "next" ? " enter-right" : dir === "prev" ? " enter-left" : "";
    var chosen = session.answers[q.id];
    var hasAns = chosen !== undefined;
    var showAns = isStudy || (hasAns && !isExam);
    var ok = !isStudy && showAns && chosen === q.answer;
    var y = keepScroll ? window.scrollY : 0;
    var qbOld = document.querySelector(".quiz-body");
    var bodyY = keepScroll && qbOld ? qbOld.scrollTop : 0;
    var total = session.ids.length, pos = session.idx + 1;
    var isFav = state.favs.indexOf(q.id) >= 0;
    var ansText = q.type === "judge" ? q.options[q.answer] : "ABCD"[q.answer] + "．" + q.options[q.answer];

    var opts = "";
    q.options.forEach(function (text, i) {
      var cls = "opt";
      if (isStudy) {
        cls += i === q.answer ? " correct" : " blank";
      } else {
        if (isExam && hasAns && chosen === i) cls += " chosen";
        if (showAns) {
          if (i === q.answer) cls += " correct";
          else if (chosen === i) cls += " wrong";
          else cls += " dim";
        }
      }
      var letter = q.type === "judge" ? (i === 0 ? "√" : "×") : "ABCD"[i];
      var mark = "";
      if (showAns && i === q.answer) mark = '<span class="mark">正确答案</span>';
      if (!isStudy && showAns && chosen === i && i !== q.answer) mark = '<span class="mark">你的选择</span>';
      opts += '<button class="' + cls + '" data-opt="' + i + '"' + (showAns ? " disabled" : "") + ">" +
        '<span class="letter">' + letter + '</span><span class="txt">' + (isStudy && i !== q.answer ? "" : esc(text)) + "</span>" + mark + "</button>";
    });

    var fb = "";
    var imageHtml = "";
    if (q.image) {
      var src = (window.QUIZ_IMAGES && window.QUIZ_IMAGES[q.image]) ? window.QUIZ_IMAGES[q.image] : "assets/img/" + q.image;
      imageHtml = '<div class="qimg"><img src="' + src + '" alt="题图" loading="lazy"></div>';
    }
    if (isStudy) {
      fb = '<div class="fb study">' +
        '<div class="fb-head">正确答案</div>' +
        '<div class="fb-ans"><b>' + esc(ansText) + "</b></div>" +
        '<div class="fb-exp"><em>解析：</em>' + esc(q.explain) + "</div>" +
      "</div>";
    } else if (showAns) {
      fb = '<div class="fb ' + (ok ? "ok" : "no") + '">' +
        '<div class="fb-head">' + (ok ? "✓ 回答正确" : "✗ 回答错误") + "</div>" +
        '<div class="fb-ans">正确答案：<b>' + esc(ansText) + "</b></div>" +
        '<div class="fb-exp"><em>解析：</em>' + esc(q.explain) + "</div>" +
      "</div>";
    }

    document.getElementById("app").className = "app-shell no-tab";
    document.getElementById("app").innerHTML =
      '<div class="quiz-screen">' +
        '<header class="quiz-bar">' +
          '<button class="icon-btn" data-act="back" aria-label="返回">' + ICONS.back + "</button>" +
          '<div class="crumb"><b>' + esc(session.title) + "</b><small>" + (isStudy ? "背题模式 · 只显示正确答案" : esc(q.chapter)) + "</small></div>" +
          (isExam
            ? '<span class="timer" id="exam-timer">' + fmtTime(session.left) + "</span>"
            : '<button class="icon-btn fav-btn ' + (isFav ? "on" : "") + '" data-act="fav" aria-label="收藏">' + ICONS.starFill + "</button>") +
          (isExam ? '<button class="icon-btn" data-act="sheet" aria-label="答题卡">' + ICONS.grid + "</button>" : "") +
        "</header>" +

        '<div class="quiz-body">' +
          '<div class="qprog"><span class="n"><b>' + pos + "</b> / " + total + '</span><span class="bar"><i style="width:' + pct(pos, total) + '%"></i></span><span class="tp">' + (q.type === "single" ? "单选" : "判断") + "</span></div>" +
          '<div class="qcard' + enterCls + '">' +
            '<div class="qhead"><span class="badge ' + q.type + '">' + (q.type === "single" ? "单项选择题" : "判断题") + "</span>" +
              (isStudy ? '<span class="badge study">背题</span>' : "") +
              '<span class="src">教材' + esc(q.page) + "</span></div>" +
            imageHtml +
            '<h1 class="qtext">' + esc(q.stem) + "</h1>" +
            '<div class="opts">' + opts + "</div>" +
            fb +
          "</div>" +
        "</div>" +

        '<div class="quiz-foot">' +
          '<button class="btn ghost" data-act="prev"' + (session.idx === 0 ? " disabled" : "") + ">上一题</button>" +
          (isExam
            ? '<button class="btn primary" data-act="next-exam"' + (session.idx === total - 1 ? " disabled" : "") + ">下一题</button>" +
              '<button class="btn dark" data-act="submit">交卷 ' + answeredCount() + "/" + total + "</button>"
            : '<button class="btn primary" data-act="next">' +
                (isStudy
                  ? (session.idx === total - 1 ? "下一题 · 完成背题" : "下一题")
                  : (session.idx === total - 1 ? "下一题 · 完成练习" : "下一题")) +
              "</button>") +
        "</div>" +
      "</div>";

    document.querySelectorAll("#app [data-opt]").forEach(function (el) {
      el.addEventListener("click", function () { choose(parseInt(el.getAttribute("data-opt"), 10)); });
    });
    document.querySelectorAll("#app [data-act]").forEach(function (el) {
      el.addEventListener("click", function () {
        var act = el.getAttribute("data-act");
        if (act === "back") goBack();
        if (act === "fav") toggleFav(q.id);
        if (act === "sheet") openSheet();
        if (act === "prev") slideTo("prev");
        if (act === "next") slideTo("next");
        if (act === "next-exam" && session.idx < session.ids.length - 1) { session.idx++; renderQuiz(false, "next"); }
        if (act === "submit") confirmSubmit();
      });
    });
    var qbNew = document.querySelector(".quiz-body");
    if (qbNew) { qbNew.scrollTop = bodyY; qbNew.scrollLeft = 0; }
    window.scrollTo(0, y);
  }

  function choose(i) {
    if (!session) return;
    if (suppressClick) return;
    if (session.mode === "study") return;
    var q = currentQ();
    if (session.mode === "exam") {
      session.answers[q.id] = i;
      renderQuiz(true);
      return;
    }
    if (session.answers[q.id] !== undefined) return;
    session.answers[q.id] = i;
    record(q, i);
    renderQuiz(true);
  }

  function record(q, i) {
    var ok = i === q.answer;
    state.records[q.id] = { a: i, c: ok ? 1 : 0, t: Date.now() };
    if (ok) delete state.wrong[q.id]; else state.wrong[q.id] = 1;
    save();
  }

  function slideTo(dir) {
    if (!session || animating) return;
    if (dir === "prev" && session.idx === 0) return;
    animating = true;
    var card = document.querySelector(".qcard");
    if (card) {
      card.style.transition = "opacity .13s ease";
      card.style.transform = "none";
      card.style.opacity = "0";
    }
    setTimeout(function () {
      animating = false;
      if (!session) return;
      if (dir === "next") {
        if (session.idx < session.ids.length - 1) {
          session.idx++;
          renderQuiz(false, "next");
        } else if (session.mode === "study") {
          finishStudy();
        } else {
          finishSession();
        }
      } else if (session.idx > 0) {
        session.idx--;
        renderQuiz(false, "prev");
      }
    }, 150);
  }

  function nextQuestion() {
    if (!session) return;
    if (session.mode === "study") {
      if (session.idx < session.ids.length - 1) {
        session.idx++;
        renderQuiz();
      } else {
        finishStudy();
      }
      return;
    }
    if (session.idx < session.ids.length - 1) {
      session.idx++;
      renderQuiz();
    } else finishSession();
  }

  function finishStudy() {
    session = null;
    toast("本章背题完成");
    location.hash = "#/home";
  }

  function finishSession() {
    if (!session) return;
    var correct = 0, wrongIds = [];
    session.ids.forEach(function (id) {
      if (session.answers[id] === BY_ID[id].answer) correct++;
      else wrongIds.push(id);
    });
    var nextSection = null;
    if (session.sectionId) {
      var si = -1;
      SECTIONS.forEach(function (s, i) { if (s.id === session.sectionId) si = i; });
      if (si >= 0 && si < SECTIONS.length - 1) {
        var cur = SECTIONS[si], ns = SECTIONS[si + 1];
        if (ns.chapter === cur.chapter) {
          nextSection = { id: ns.id, title: ns.title, chapter: ns.chapter, count: ns.questions.length };
        }
      }
    }
    if (session.mode === "exam" && session.examId) {
      var examScore = Math.round((correct / session.ids.length) * 100);
      state.examBest = state.examBest || {};
      if (state.examBest[session.examId] == null || examScore > state.examBest[session.examId]) {
        state.examBest[session.examId] = examScore;
        save();
      }
    }
    lastResult = {
      ids: session.ids.slice(),
      title: session.title,
      mode: session.mode,
      total: session.ids.length,
      correct: correct,
      answered: answeredCount(),
      wrongIds: wrongIds,
      sectionId: session.sectionId,
      examId: session.examId,
      nextSection: nextSection
    };
    session = null;
    clearInterval(examTimer);
    location.hash = "#/result";
  }

  function submitExam() {
    if (!session) return;
    session.ids.forEach(function (id) {
      var q = BY_ID[id], a = session.answers[id];
      if (a === undefined) {
        state.records[id] = { a: -1, c: 0, t: Date.now() };
        state.wrong[id] = 1;
      } else {
        var ok = a === q.answer;
        state.records[id] = { a: a, c: ok ? 1 : 0, t: Date.now() };
        if (ok) delete state.wrong[id]; else state.wrong[id] = 1;
      }
    });
    save();
    finishSession();
  }

  function confirmSubmit() {
    var left = answeredCount(), total = session.ids.length;
    openModal(
      '<div class="sheet-head"><b>确认交卷</b><button class="close" data-close>关闭</button></div>' +
      '<p style="font-size:13px;line-height:1.8;color:#4b5563;margin:0 0 14px">已答 ' + left + " / " + total + " 题" +
      (left < total ? '，还有 <b style="color:#b91c1c">' + (total - left) + "</b> 题未答，未答按错误计。" : "，已全部作答。") + "</p>" +
      '<button class="btn primary sheet-submit" data-submit>确认交卷</button>'
    );
    document.querySelector("[data-submit]").addEventListener("click", function () {
      closeModal(); submitExam();
    });
  }

  function toggleFav(id) {
    var i = state.favs.indexOf(id);
    if (i >= 0) { state.favs.splice(i, 1); toast("已取消收藏"); }
    else { state.favs.push(id); toast("已收藏"); }
    save(); renderQuiz(true);
  }

  function goBack() {
    if (session && session.mode === "exam") {
      openModal(
        '<div class="sheet-head"><b>退出考试？</b><button class="close" data-close>关闭</button></div>' +
        '<p style="font-size:13px;line-height:1.8;color:#4b5563;margin:0 0 14px">本次作答不会计分，也不会保存答题记录。</p>' +
        '<button class="btn primary sheet-submit" data-quit>退出</button>'
      );
      document.querySelector("[data-quit]").addEventListener("click", function () {
        closeModal(); session = null; clearInterval(examTimer); location.hash = "#/home";
      });
      return;
    }
    var back = session && session.back ? session.back : "#/home";
    session = null;
    location.hash = back;
  }

  /* ---------------- 答题卡（考试用） ---------------- */
  function openSheet() {
    if (!session) return;
    var isExam = session.mode === "exam";
    var grid = "";
    session.ids.forEach(function (id, i) {
      var a = session.answers[id], cls = "";
      if (a !== undefined) cls = isExam ? "done" : (a === BY_ID[id].answer ? "ok" : "bad");
      if (i === session.idx) cls += " cur";
      grid += '<button class="' + cls + '" data-jump="' + i + '">' + (i + 1) + "</button>";
    });
    openModal(
      '<div class="sheet-head"><b>答题卡</b><button class="close" data-close>收起</button></div>' +
      '<div class="sheet-legend"><span><i style="background:#fff;border:1px solid #e4e6ea"></i>未答</span>' +
      (isExam ? '<span><i style="background:#23252a"></i>已答</span>'
        : '<span><i style="background:#15803d"></i>正确</span><span><i style="background:#b91c1c"></i>错误</span>') +
      "</div><div class=\"grid\">" + grid + "</div>" +
      (isExam ? '<button class="btn dark sheet-submit" data-sheet-submit>交卷（' + answeredCount() + "/" + session.ids.length + "）</button>" : "")
    );
    document.querySelectorAll("[data-jump]").forEach(function (el) {
      el.addEventListener("click", function () {
        session.idx = parseInt(el.getAttribute("data-jump"), 10);
        closeModal(); renderQuiz();
      });
    });
    var sub = document.querySelector("[data-sheet-submit]");
    if (sub) sub.addEventListener("click", function () { closeModal(); confirmSubmit(); });
  }

  /* ---------------- 结果 ---------------- */
  function renderResult() {
    if (!lastResult) { location.hash = "#/home"; return; }
    var r = lastResult, score = pct(r.correct, r.total);
    var wrongHtml = "";
    r.wrongIds.slice(0, 8).forEach(function (id) {
      var q = BY_ID[id];
      wrongHtml += '<div class="wrong-item"><div class="q">' + esc(q.stem) + '</div><div class="a">正确答案：' +
        esc(q.type === "judge" ? q.options[q.answer] : "ABCD"[q.answer] + "．" + q.options[q.answer]) + "</div></div>";
    });

    document.getElementById("app").className = "app-shell no-tab";
    document.getElementById("app").innerHTML =
      '<header class="appbar"><div class="seal-sm">武</div><div class="name"><b>练习结果</b><small>' + esc(r.title) + "</small></div></header>" +
      '<div class="result-wrap">' +
        '<div class="result-card">' +
          '<div class="score-ring" style="--p:' + score + '"><div class="inner"><div class="num">' + score + '<small>分</small></div><div class="lbl">正确率</div></div></div>' +
          "<h2>" + (score >= 60 ? (r.mode === "exam" ? "考试完成" : "练习完成") : "继续加油") + "</h2>" +
          '<p class="sub">' + (r.mode === "exam" ? "已交卷 · " : "") + "共 " + r.total + " 题</p>" +
          '<div class="result-stats">' +
            "<div><b>" + r.correct + "</b><span>答对</span></div>" +
            "<div><b>" + (r.total - r.correct) + "</b><span>答错</span></div>" +
            "<div><b>" + r.answered + "</b><span>已作答</span></div>" +
          "</div>" +
          '<div class="result-actions">' +
            '<button class="btn ghost" style="flex:1" data-act="again">' +
              (r.mode === "exam" && r.examId ? "再考一次" : "再练一遍") + "</button>" +
            '<a class="btn ghost" style="flex:1" href="#/home">返回首页</a>' +
          "</div>" +
        "</div>" +
        (r.nextSection
          ? '<button class="next-section" data-next="' + r.nextSection.id + '">' +
              '<span class="ns-text"><span class="ns-kicker">下一节 · 共 ' + r.nextSection.count + ' 题</span>' +
                '<span class="ns-title">' + esc(r.nextSection.title) + "</span></span>" +
              '<span class="ns-arrow">›</span>' +
            "</button>"
          : "") +
        (r.wrongIds.length
          ? '<div class="wrong-block"><h3>错题回顾（' + r.wrongIds.length + " 题）</h3>" + wrongHtml +
            '<a class="btn ghost" style="margin-top:4px" href="#/wrong">进入错题本</a></div>'
          : '<p style="text-align:center;color:#15803d;font-size:12.5px;margin-top:16px">全部答对。</p>') +
      "</div>";

    document.querySelector('[data-act="again"]').addEventListener("click", function () {
      if (r.mode === "exam" && r.examId) startExamPaper(r.examId);
      else startSession(r.ids, r.title, "practice", 0, { sectionId: r.sectionId });
    });
    var nextBtn = document.querySelector("[data-next]");
    if (nextBtn) nextBtn.addEventListener("click", function () {
      var sid = nextBtn.getAttribute("data-next");
      var sec = SECTIONS.filter(function (s) { return s.id === sid; })[0];
      if (!sec) return;
      startSession(sec.questions.map(function (q) { return q.id; }), sec.title, "practice", 0, { sectionId: sec.id });
    });
    window.scrollTo(0, 0);
  }

  /* ---------------- 错题 / 收藏 ---------------- */
  function renderList(kind) {
    var isWrong = kind === "wrong";
    var ids = isWrong ? Object.keys(state.wrong) : state.favs.slice();
    var qs = ids.map(function (id) { return BY_ID[id]; }).filter(Boolean);

    var items = "";
    qs.forEach(function (q, i) {
      items += '<button class="list-item" data-id="' + q.id + '">' +
        '<span class="idx">' + pad2(i + 1) + "</span>" +
        '<span class="bd"><span class="q">' + esc(q.stem) + "</span>" +
        '<span class="meta">' + esc(q.sectionTitle) + " · " + (q.type === "single" ? "单选" : "判断") + " · 教材" + esc(q.page) + "</span>" +
        (isWrong ? '<span class="ans">答案：' + esc(q.type === "judge" ? q.options[q.answer] : "ABCD"[q.answer] + "．" + q.options[q.answer]) + "</span>" : "") +
        "</span></button>";
    });

    document.getElementById("app").className = "app-shell";
    document.getElementById("app").innerHTML =
      '<header class="appbar"><div class="seal-sm">武</div><div class="name"><b>' + (isWrong ? "错题本" : "我的收藏") + "</b><small>" +
        (isWrong ? "答错自动收录，答对后移出" : "练习时点星标收藏") + "</small></div></header>" +
      '<div class="list-head"><div><h1>' + (isWrong ? "错题 " + qs.length : "收藏 " + qs.length) + '</h1><p>' +
        (isWrong ? "按最近练习顺序" : "重点题回看") + "</p></div>" +
        (qs.length ? '<button class="act" data-act="all">全部重练</button>' : "") + "</div>" +
      '<div class="list">' +
        (qs.length ? items
          : '<div class="empty"><span class="big">' + (isWrong ? "净" : "藏") + "</span>" +
            (isWrong ? "还没有错题。<br>做错的题会自动收进来。" : "还没有收藏。<br>练习时点右上角星标即可收藏。") + "</div>") +
      "</div>" + tabbar(kind === "wrong" ? "wrong" : "fav");

    document.querySelectorAll("[data-id]").forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-id");
        var idx = qs.findIndex(function (q) { return q.id === id; });
        startSession(qs.map(function (q) { return q.id; }), isWrong ? "错题重练" : "收藏练习", "practice", Math.max(0, idx));
      });
    });
    var all = document.querySelector('[data-act="all"]');
    if (all) all.addEventListener("click", function () {
      startSession(qs.map(function (q) { return q.id; }), isWrong ? "错题重练" : "收藏练习", "practice");
    });
    window.scrollTo(0, 0);
  }

  /* ---------------- 弹层 ---------------- */
  function openModal(inner, opts) {
    modalOpen = true;
    var center = opts && opts.center;
    document.getElementById("modal-root").innerHTML =
      '<div class="modal-mask' + (center ? " center" : "") + '" role="dialog" aria-modal="true">' +
      '<div class="' + (center ? "dialog" : "sheet") + '">' + inner + "</div></div>";
    document.body.style.overflow = "hidden";
    var mask = document.querySelector(".modal-mask");
    mask.addEventListener("click", function (e) { if (e.target === mask) closeModal(); });
    document.querySelectorAll("[data-close]").forEach(function (el) { el.addEventListener("click", closeModal); });
  }
  function closeModal() {
    modalOpen = false;
    document.getElementById("modal-root").innerHTML = "";
    document.body.style.overflow = "";
  }
  var toastTimer = null;
  function toast(msg) {
    var old = document.querySelector(".toast");
    if (old) old.remove();
    var el = document.createElement("div");
    el.className = "toast"; el.textContent = msg;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.remove(); }, 1600);
  }

  function confirmReset() {
    openModal(
      '<div class="confirm-icon"><svg viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6.5 7l1 13h9l1-13"/><path d="M10 11v6M14 11v6"/></svg></div>' +
      '<h3>清空练习记录？</h3>' +
      '<p class="desc">答题记录、错题、收藏和模拟成绩都会被清除，<br>且无法恢复。</p>' +
      '<div class="confirm-actions">' +
        '<button class="btn ghost" data-close>取消</button>' +
        '<button class="btn danger" data-clear>确认清空</button>' +
      "</div>",
      { center: true }
    );
    document.querySelector("[data-clear]").addEventListener("click", function () {
      var keepFont = state.font, keepTheme = state.theme;
      state = { records: {}, favs: [], wrong: {}, examBest: {}, expanded: {}, font: keepFont, theme: keepTheme };
      applyPrefs();
      save(); closeModal(); renderHome(); toast("已清空");
    });
  }

  /* ---------------- 路由 ---------------- */
  function route() {
    var hash = location.hash || "#/home";
    if (hash !== "#/quiz") clearInterval(examTimer);

    if (hash === "#/home" || hash === "") renderHome();
    else if (hash.indexOf("#/practice/") === 0) {
      var id = hash.replace("#/practice/", "");
      var sec = SECTIONS.filter(function (s) { return s.id === id; })[0];
      if (sec) startSession(sec.questions.map(function (q) { return q.id; }), sec.title, "practice", 0, { sectionId: sec.id });
      else location.hash = "#/home";
    }
    else if (hash.indexOf("#/type/") === 0) {
      var t = hash.replace("#/type/", "");
      var list = ALL.filter(function (q) { return q.type === t; });
      if (list.length) startSession(list.map(function (q) { return q.id; }), t === "single" ? "单项选择题专项" : "判断题专项", "practice");
      else location.hash = "#/home";
    }
    else if (hash === "#/quiz") {
      renderQuiz();
      if (session && session.mode === "exam" && !examTimer) startExamTimer();
    }
    else if (hash === "#/result") renderResult();
    else if (hash === "#/wrong") renderList("wrong");
    else if (hash === "#/fav") renderList("fav");
    else location.hash = "#/home";
  }

  window.addEventListener("hashchange", route);

  document.addEventListener("keydown", function (e) {
    if (modalOpen) { if (e.key === "Escape") closeModal(); return; }
    if (!session || location.hash !== "#/quiz") return;
    var q = currentQ();
    if (!q) return;
    if (e.key >= "1" && e.key <= String(q.options.length)) choose(parseInt(e.key, 10) - 1);
    if (e.key === "ArrowLeft" && session.idx > 0) slideTo("prev");
    if (e.key === "ArrowRight" && session.mode !== "exam") slideTo("next");
  });

  /* 手机左右滑动切换题目 */
  var touchStartX = 0, touchStartY = 0, touchStartT = 0;
  document.addEventListener("touchstart", function (e) {
    if (!session || location.hash !== "#/quiz" || modalOpen || animating) return;
    var target = e.target;
    if (target && target.closest && (target.closest(".quiz-foot") || target.closest(".quiz-bar"))) return;
    var t = e.changedTouches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchStartT = Date.now();
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (!session || location.hash !== "#/quiz" || modalOpen || animating) return;
    var target = e.target;
    if (target && target.closest && (target.closest(".quiz-foot") || target.closest(".quiz-bar"))) return;
    if (Date.now() - touchStartT > 700) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;
    if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    suppressClick = true;
    setTimeout(function () { suppressClick = false; }, 320);
    slideTo(dx < 0 ? "next" : "prev");
  }, { passive: true });

  applyPrefs();
  route();
})();

</script>
</body>
</html>
